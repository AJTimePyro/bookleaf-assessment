[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.30",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

